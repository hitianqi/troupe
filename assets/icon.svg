    @keyframes roll { to { transform: translateY(100px); } }
    @keyframes crawl { to { transform: translateY(1.6px); } }
    @keyframes warm {
      0%, 33%, 39%, 100% { transform: translate(0, 0); }
      34% { transform: translate(-1.4px, 0); }
      35.5% { transform: translate(0.9px, 0.2px); }
      37% { transform: translate(-0.6px, 0); }
    }
    @keyframes cool {
      0%, 33%, 39%, 100% { transform: translate(0, 0); }
      34% { transform: translate(1.4px, 0); }
      35.5% { transform: translate(-0.9px, -0.2px); }
      37% { transform: translate(0.6px, 0); }
    }
    @keyframes flicker {
      0%, 40%, 43%, 76%, 78%, 100% { opacity: 0; }
      41% { opacity: 1; }
      42% { opacity: 0.4; }
      77% { opacity: 0.6; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
