  <defs>
    <clipPath id="tile"><rect width="100" height="100" rx="23"/></clipPath>
    <radialGradient id="glow" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#2F5079"/>
      <stop offset="1" stop-color="#18293F"/>
    </radialGradient>
    <radialGradient id="tube" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4EEE0" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#F4EEE0" stop-opacity="0.07"/>
      <stop offset="0.92" stop-color="#F4EEE0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F4EEE0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
      <rect width="1.6" height="0.55" fill="#000" fill-opacity="0.13"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.16"/></feComponentTransfer>
    </filter>
    <clipPath id="front"><rect x="-20" y="54" width="140" height="60" transform="rotate(-16 50 54)"/></clipPath>
    <clipPath id="back"><rect x="-20" y="-6" width="140" height="60" transform="rotate(-16 50 54)"/></clipPath>
    <g id="orb">
      <circle r="5" fill="#F29B7A" fill-opacity="0.16"/>
      <circle r="2.18" fill="#F29B7A"/>
    </g>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="100" height="100" fill="url(#glow)"/>
    <ellipse cx="50" cy="54" rx="42" ry="13" transform="rotate(-16 50 54)" fill="none" stroke="#F29B7A" stroke-width="1.2" stroke-dasharray="0.1 3" stroke-linecap="round"/>
    <g clip-path="url(#back)"><use href="#orb" class="ball"/></g>
    <g class="warm" fill="#F29B7A" fill-opacity="0.8"><rect x="22.5" y="24" width="55" height="15"/><rect x="41" y="24" width="15" height="54"/></g>
    <g class="cool" fill="#7FA9D9" fill-opacity="0.75"><rect x="24.5" y="25" width="55" height="15"/><rect x="43" y="25" width="15" height="54"/></g>
    <g fill="#F4EEE0"><rect x="23.5" y="24.5" width="55" height="15"/><rect x="42" y="24.5" width="15" height="54"/></g>
    <g clip-path="url(#front)">
