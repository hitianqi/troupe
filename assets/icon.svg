      <use href="#orb" class="ball"/>
    </g>
    <rect class="roll" width="100" height="26" fill="url(#band)"/>
    <rect class="scan" y="-1.6" width="100" height="103.2" fill="url(#scan)"/>
    <rect class="dim" width="100" height="100" fill="#000" fill-opacity="0.09"/>
    <rect width="100" height="100" fill="url(#tube)"/>
    <rect width="100" height="100" filter="url(#grain)"/>
